# Site deleted. Public site = GitHub Pages only.
# Keep this file so a future Netlify reconnect cannot run a Next build.
# Do not add functions or `npm run build` here.

[build]
  command = "mkdir -p netlify-stub && echo disabled > netlify-stub/index.html"
  publish = "netlify-stub"
  ignore = "true"

[context.deploy-preview]
  ignore = "true"

[context.branch-deploy]
  ignore = "true"
