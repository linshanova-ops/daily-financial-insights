# DISABLED — public site is GitHub Pages only.
# https://linshanova-ops.github.io/daily-financial-insights/
#
# Do NOT reconnect this repo to Netlify for a full Next build (burns credits).
# If a Netlify site is still linked: Site settings → stop builds / delete site,
# and remove env GITHUB_PAT. Manual briefing updates never need Netlify.

[build]
  command = "mkdir -p netlify-stub && printf '%s\\n' '<!doctype html><meta charset=utf-8><title>disabled</title><p>Netlify disabled. Use <a href=\"https://linshanova-ops.github.io/daily-financial-insights/\">GitHub Pages</a>.</p>' > netlify-stub/index.html"
  publish = "netlify-stub"
  # Always skip — exit 0 cancels the build (0 credits).
  ignore = "true"

[context.deploy-preview]
  ignore = "true"

[context.branch-deploy]
  ignore = "true"
