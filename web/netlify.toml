# DISABLED — public site is GitHub Pages only.
# Live: https://linshanova-ops.github.io/daily-financial-insights/
# Refresh function returns 410. Disconnect syravocado.netlify.app in the
# Netlify dashboard (stop builds / delete site) to fully stop credit use.

[build]
  command = "mkdir -p netlify-stub && printf '%s\\n' '<!doctype html><meta charset=utf-8><title>disabled</title><p>Netlify disabled. Use <a href=\"https://linshanova-ops.github.io/daily-financial-insights/\">GitHub Pages</a>.</p>' > netlify-stub/index.html"
  publish = "netlify-stub"
  functions = "netlify/functions"
  # One more deploy when this file / functions change (ships 410), then skips.
  # After disconnecting the Netlify site, this never runs.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify.toml netlify/"

[context.deploy-preview]
  ignore = "true"

[context.branch-deploy]
  ignore = "true"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_SKIP_INSTALL = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
