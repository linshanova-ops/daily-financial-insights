name: Weekday 09:00 Beijing

# IMAP fetch, then start the weekday briefing. Cloud VMs have no IMAP secrets
# and cannot `gh workflow run` (403). This workflow is the 09:00 clock —
# turn the Cursor dashboard 09:00 automation off (it races this fetch).
on:
  schedule:
    # 09:00 Beijing Mon–Fri. 财经早茶 lands ~07:06; fetch at publish time so
    # $TODAY is on main when the agent starts. GH cron can slip ~1h;
    # missed-briefing-catchup.yml at 09:30 is the backup.
    - cron: "0 1 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inbox-sync.yml"

permissions:
  contents: write

concurrency:
  group: inbox-sync
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install IMAP deps
        run: npm install --prefix scripts

      - name: Fetch inbox newsletters
        env:
          INBOX_IMAP_HOST: ${{ secrets.INBOX_IMAP_HOST }}
          INBOX_IMAP_USER: ${{ secrets.INBOX_IMAP_USER }}
          INBOX_IMAP_PASSWORD: ${{ secrets.INBOX_IMAP_PASSWORD }}
          INBOX_IMAP_PORT: ${{ secrets.INBOX_IMAP_PORT }}
        run: |
          export BRIEFING_DATE
          BRIEFING_DATE=$(TZ=Asia/Shanghai date +%F)
          echo "BRIEFING_DATE=$BRIEFING_DATE"
          node scripts/fetch-inbox-sources.mjs

      - name: Commit inbox captures
        run: |
          if [ -n "$(git status --porcelain -- web/content/inbox web/public/inbox-charts)" ]; then
            git config user.name "syravocado"
            git config user.email "linshanova-ops@users.noreply.github.com"
            git add web/content/inbox web/public/inbox-charts
            git commit -m "chore: sync IMAP inbox captures"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No inbox changes to commit."
          fi

  briefing:
    needs: inbox
    if: always() && !cancelled() && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Start weekday briefing
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::notice::No CURSOR_API_KEY — add the secret."
            exit 0
          fi
          npm install @cursor/sdk@latest
          node scripts/nudge-missed-briefing.mjs
