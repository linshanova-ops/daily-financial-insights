name: Weekday 09:00 Beijing IMAP

# 财经早茶 is in Gmail by ~07:40. Fetch at the same 09:00 as the Cursor
# publish so one run maps mail + 见闻 + CICC + prints. Do not Agent.create
# here (dashboard is the clock; 09:30 catch-up may create). Cloud VMs have
# no IMAP secrets and cannot `gh workflow run` (403).
# Pushing this file runs that same job (not a second slot).
# last-kick: 2026-09-04T02:36Z GH schedule skipped after 180×30s wait
on:
  schedule:
    # 09:00 Beijing Mon–Fri — same clock as the briefing agent.
    # GH cron on this slot has been landing ~10:20; the agent waits.
    - cron: "0 1 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inbox-sync.yml"

permissions:
  contents: write

concurrency:
  group: inbox-sync
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install IMAP deps
        run: npm install --prefix scripts

      - name: Fetch inbox newsletters
        env:
          INBOX_IMAP_HOST: ${{ secrets.INBOX_IMAP_HOST }}
          INBOX_IMAP_USER: ${{ secrets.INBOX_IMAP_USER }}
          INBOX_IMAP_PASSWORD: ${{ secrets.INBOX_IMAP_PASSWORD }}
          INBOX_IMAP_PORT: ${{ secrets.INBOX_IMAP_PORT }}
        run: |
          export BRIEFING_DATE
          BRIEFING_DATE=$(TZ=Asia/Shanghai date +%F)
          echo "BRIEFING_DATE=$BRIEFING_DATE"
          node scripts/fetch-inbox-sources.mjs

      - name: Commit inbox captures
        run: |
          if [ -n "$(git status --porcelain -- web/content/inbox web/public/inbox-charts)" ]; then
            git config user.name "syravocado"
            git config user.email "linshanova-ops@users.noreply.github.com"
            git add web/content/inbox web/public/inbox-charts
            git commit -m "chore: sync IMAP inbox captures"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No inbox changes to commit."
          fi
