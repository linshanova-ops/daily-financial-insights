name: Weekday 08:00 Beijing IMAP

# 财经早茶 hits Gmail ~07:00–07:40. Fetch at 08:00 so the 09:00 Cursor
# agent already has $TODAY on main. Do not also fetch at 09:00 (duplicate
# + race). Do not Agent.create here (09:00 dashboard is the clock; 09:30
# catch-up may create). Cloud VMs have no IMAP secrets and cannot
# `gh workflow run` (403).
on:
  schedule:
    # 08:00 Beijing Mon–Fri. After the 7am mail, before the 9am agent.
    # GH cron on `0 1` was landing ~10:20; 09:00 waits up to 20 min if this slips.
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inbox-sync.yml"

permissions:
  contents: write

concurrency:
  group: inbox-sync
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install IMAP deps
        run: npm install --prefix scripts

      - name: Fetch inbox newsletters
        env:
          INBOX_IMAP_HOST: ${{ secrets.INBOX_IMAP_HOST }}
          INBOX_IMAP_USER: ${{ secrets.INBOX_IMAP_USER }}
          INBOX_IMAP_PASSWORD: ${{ secrets.INBOX_IMAP_PASSWORD }}
          INBOX_IMAP_PORT: ${{ secrets.INBOX_IMAP_PORT }}
        run: |
          export BRIEFING_DATE
          BRIEFING_DATE=$(TZ=Asia/Shanghai date +%F)
          echo "BRIEFING_DATE=$BRIEFING_DATE"
          node scripts/fetch-inbox-sources.mjs

      - name: Commit inbox captures
        run: |
          if [ -n "$(git status --porcelain -- web/content/inbox web/public/inbox-charts)" ]; then
            git config user.name "syravocado"
            git config user.email "linshanova-ops@users.noreply.github.com"
            git add web/content/inbox web/public/inbox-charts
            git commit -m "chore: sync IMAP inbox captures"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No inbox changes to commit."
          fi
