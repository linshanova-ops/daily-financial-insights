name: Missed weekday briefing catch-up

# If 09:00 missed: send weekday prompt to leftover holding the cap, or create if cap is free.
# No-op when $TODAY.md is already on main. Idle refresh-briefing still never Agent.create.
on:
  schedule:
    - cron: "30 1 * * 1-5" # 09:30 Beijing Mon–Fri
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: missed-briefing-catchup
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Catch up if today's briefing is missing
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::notice::No CURSOR_API_KEY — add the secret."
            exit 0
          fi
          npm install @cursor/sdk@latest
          node scripts/nudge-missed-briefing.mjs
