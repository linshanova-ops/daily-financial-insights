name: Generate daily briefing

on:
  # GitHub schedule is BEST-EFFORT and has skipped entire publish windows.
  # Strategy:
  #   1) Light primary ticks at :00/:15/:30/:45 of Beijing hours (UTC 0 and 12)
  #   2) Hourly heartbeat at :05 every hour — recovers missed slots for 6h
  #   3) External cron-job.org repository_dispatch (REQUIRED for true on-time)
  #      — see docs/ON_TIME_PUBLISH.md
  #
  # Cursor Agent.create is controlled by web/content/briefing-ops.json
  # (manual mode until cursorAutoResumeOn). Fund RSS + optional inbox fetch
  # can still run without Cursor tokens.
  schedule:
    - cron: "0,15,30,45 0 * * *"
    - cron: "0,15,30,45 12 * * *"
    - cron: "5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-briefing]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: write

concurrency:
  group: generate-daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Beijing 08:00 / 20:00 slot gate
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISPATCH_FORCE: ${{ github.event.client_payload.force }}
        run: node scripts/briefing-slot-gate.mjs

      - name: Cursor auto-generate ops gate
        id: ops
        if: steps.gate.outputs.should_run == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DISPATCH_FORCE_CURSOR: ${{ github.event.client_payload.force_cursor }}
        run: node scripts/briefing-ops-gate.mjs

      - name: Check for CURSOR_API_KEY
        id: key
        if: steps.gate.outputs.should_run == 'true' && steps.ops.outputs.cursor_auto == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add repository secret CURSOR_API_KEY to enable automatic daily briefings."
            echo "Manual publish: open a PR with web/content/briefings/YYYY-MM-DD.md; Briefing accuracy gate must pass."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install script deps (IMAP + Cursor SDK)
        if: steps.gate.outputs.should_run == 'true' && steps.ops.outputs.cursor_auto == 'true' && steps.key.outputs.present == 'true'
        run: |
          npm install @cursor/sdk@latest
          npm install --prefix scripts

      # Inbox fetch must NOT require Cursor: manual briefing mode still needs
      # Bloomberg / Glassnode email committed for human/agent merge.
      - name: Install IMAP deps only (manual mode)
        if: steps.gate.outputs.should_run == 'true' && steps.ops.outputs.cursor_auto != 'true'
        run: npm install --prefix scripts

      - name: Fetch inbox newsletters (Bloomberg daily + Glassnode weekly)
        if: >-
          steps.gate.outputs.should_run == 'true' &&
          (
            steps.ops.outputs.cursor_auto != 'true' ||
            (steps.ops.outputs.cursor_auto == 'true' && steps.key.outputs.present == 'true')
          )
        env:
          INBOX_IMAP_HOST: ${{ secrets.INBOX_IMAP_HOST }}
          INBOX_IMAP_USER: ${{ secrets.INBOX_IMAP_USER }}
          INBOX_IMAP_PASSWORD: ${{ secrets.INBOX_IMAP_PASSWORD }}
          INBOX_IMAP_PORT: ${{ secrets.INBOX_IMAP_PORT }}
          BRIEFING_DATE: ${{ steps.gate.outputs.briefing_date }}
        run: node scripts/fetch-inbox-sources.mjs

      - name: Commit inbox captures (no Cursor tokens)
        if: steps.gate.outputs.should_run == 'true'
        run: |
          if [ -n "$(git status --porcelain -- web/content/inbox web/public/inbox-charts)" ]; then
            git config user.name "syravocado"
            git config user.email "linshanova-ops@users.noreply.github.com"
            git add web/content/inbox web/public/inbox-charts
            git commit -m "chore: sync IMAP inbox captures for ${{ steps.gate.outputs.briefing_date }}"
            git push origin main
          else
            echo "No inbox changes to commit."
          fi

      - name: Fetch Event Calendar fixtures (gov + earnings)
        id: calendar
        if: steps.gate.outputs.should_run == 'true' && steps.gate.outputs.is_catchup != 'true'
        continue-on-error: true
        run: |
          set +e
          before=$(git rev-parse HEAD)
          node scripts/fetch-event-calendar.mjs --date "${{ steps.gate.outputs.briefing_date }}" --commit
          code=$?
          after=$(git rev-parse HEAD)
          set -e
          if [ "$code" -ne 0 ]; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi
          if [ "$before" != "$after" ]; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      # Fund module: no Cursor tokens. Primary Beijing window only.
      - name: Scan Fund signals (Hedgeweek + Google News)
        id: fund
        if: steps.gate.outputs.should_run == 'true' && steps.gate.outputs.is_catchup != 'true'
        continue-on-error: true
        run: |
          set +e
          before=$(git rev-parse HEAD)
          node scripts/scan-fund-signals.mjs --commit
          code=$?
          after=$(git rev-parse HEAD)
          set -e
          if [ "$code" -ne 0 ]; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi
          if [ "$before" != "$after" ]; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Pages after Fund content refresh
        if: steps.gate.outputs.should_run == 'true' && steps.fund.outputs.committed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type=deploy-pages \
            || echo "::notice::Could not dispatch deploy-pages."

      - name: Restore Cursor usage-limit skip marker
        id: usage_skip
        if: >-
          steps.gate.outputs.should_run == 'true' &&
          steps.ops.outputs.cursor_auto == 'true' &&
          steps.key.outputs.present == 'true' &&
          github.event_name != 'workflow_dispatch' &&
          github.event.client_payload.force != true &&
          github.event.client_payload.force != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/cursor-usage-skip
          key: cursor-usage-skip-v2-${{ steps.gate.outputs.briefing_date }}-${{ steps.gate.outputs.slot_id }}

      - name: Generate briefing PR, wait for CI, auto-merge when green
        if: >-
          steps.gate.outputs.should_run == 'true' &&
          steps.ops.outputs.cursor_auto == 'true' &&
          steps.key.outputs.present == 'true' &&
          (
            github.event_name == 'workflow_dispatch' ||
            github.event.client_payload.force == true ||
            github.event.client_payload.force == 'true' ||
            steps.usage_skip.outputs.cache-hit != 'true'
          )
        timeout-minutes: 90
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REPO_URL: https://github.com/linshanova-ops/daily-financial-insights
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIEFING_DATE: ${{ steps.gate.outputs.briefing_date }}
          BRIEFING_SLOT_ID: ${{ steps.gate.outputs.slot_id }}
          BRIEFING_FORCE_CURSOR: ${{ github.event.client_payload.force_cursor }}
          CURSOR_USAGE_SKIP_DIR: ${{ github.workspace }}/.cache/cursor-usage-skip
        run: node scripts/generate-daily-briefing.mjs

      - name: Notice when Cursor generate skipped (manual mode or cooldown)
        if: >-
          steps.gate.outputs.should_run == 'true' &&
          (
            steps.ops.outputs.cursor_auto != 'true' ||
            steps.usage_skip.outputs.cache-hit == 'true'
          )
        run: |
          if [ "${{ steps.ops.outputs.cursor_auto }}" != "true" ]; then
            echo "::notice::Manual briefing mode — Cursor Agent.create skipped (${{ steps.ops.outputs.cursor_auto_reason }}). Resume on ${{ steps.ops.outputs.resume_on }}. Website Fund scans still run on primary windows."
          else
            echo "::warning::Usage-limit skip marker armed — raise Spend Limit or force_cursor=true."
          fi
