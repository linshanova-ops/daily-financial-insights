name: Overdue Beijing slot alert

# Manual-only publish mode: no scheduled overdue checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Fail if Beijing slot still unpublished
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-overdue-slot.mjs
