name: Deploy syravocado to GitHub Pages

on:
  push:
    branches: [main]
  # No schedule — manual publish mode. Pages deploys on push to main only.
  workflow_dispatch:
  # Orchestrator dispatches this after GITHUB_TOKEN merges (push from that
  # token does not start other workflows).
  repository_dispatch:
    types: [deploy-pages]

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

# Do not cancel in-progress deploys (cancel thrash left Pages stuck queued).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Re-assert Actions as the Pages deployment source (unsticks some queues).
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Sync briefing JSON feed
        run: npm run sync-data

      - name: Scan all website source links
        run: npm run scan-links

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

      # Mirror export to gh-pages so a manual Pages source switch can go live
      # if the Actions deploy queue is still wedged.
      - name: Mirror to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/out
          force_orphan: true
          user_name: syravocado
          user_email: linshanova-ops@users.noreply.github.com
          commit_message: "deploy: mirror site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clear stale Pages deployment statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=20" \
            --jq '.[].id')
          for id in $ids; do
            state=$(gh api "repos/${{ github.repository }}/deployments/${id}/statuses" \
              --jq '.[0].state // "none"')
            echo "deployment ${id}: ${state}"
            if [ "$state" = "queued" ] || [ "$state" = "in_progress" ] || [ "$state" = "pending" ]; then
              echo "Marking ${id} inactive"
              gh api -X POST "repos/${{ github.repository }}/deployments/${id}/statuses" \
                -f state=inactive \
                -f description="cleared before republish" \
                >/dev/null || true
            fi
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
