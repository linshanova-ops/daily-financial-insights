name: Deploy syravocado to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Safety-net redeploy after each Beijing publish window (incl. catch-up).
    - cron: "50 0,12 * * *"
  workflow_dispatch:
  # Orchestrator dispatches this after GITHUB_TOKEN merges (push from that
  # token does not start other workflows).
  repository_dispatch:
    types: [deploy-pages]

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

# Do not cancel in-progress deploys: cancelled deploy-pages runs leave
# GitHub Pages requests stuck in deployment_queued and block later publishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Required so Actions-sourced Pages actually processes deploy-pages
      # requests (otherwise they sit forever at deployment_queued).
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Sync briefing JSON feed
        run: npm run sync-data

      - name: Scan all website source links
        run: npm run scan-links

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clear stale Pages deployment statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Release environment lock if prior deploy-pages timed out while queued.
          ids=$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=15" \
            --jq '.[].id')
          for id in $ids; do
            state=$(gh api "repos/${{ github.repository }}/deployments/${id}/statuses" \
              --jq '.[0].state // "none"')
            echo "deployment ${id}: ${state}"
            if [ "$state" = "queued" ] || [ "$state" = "in_progress" ] || [ "$state" = "pending" ]; then
              echo "Marking ${id} inactive"
              gh api -X POST "repos/${{ github.repository }}/deployments/${id}/statuses" \
                -f state=inactive \
                -f description="cleared before republish" \
                >/dev/null || true
            fi
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
