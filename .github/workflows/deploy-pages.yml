name: Deploy syravocado to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Safety-net redeploy after each Beijing publish window (incl. catch-up).
    - cron: "50 0,12 * * *"
  workflow_dispatch:
  # Orchestrator dispatches this after GITHUB_TOKEN merges (push from that
  # token does not start other workflows).
  repository_dispatch:
    types: [deploy-pages]

permissions:
  contents: write
  pages: write

# Avoid cancel thrash; one publish at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Sync briefing JSON feed
        run: npm run sync-data

      - name: Scan all website source links
        run: npm run scan-links

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      # Bypass stuck actions/deploy-pages (deployment_queued timeouts) by
      # publishing the static export to the gh-pages branch.
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/out
          force_orphan: true
          user_name: syravocado
          user_email: linshanova-ops@users.noreply.github.com
          commit_message: "deploy: publish site"

      - name: Point GitHub Pages at gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # legacy = branch-sourced Pages (avoids broken Actions deploy queue)
          gh api -X PUT "repos/${{ github.repository }}/pages" --input - <<'EOF'
          {
            "build_type": "legacy",
            "source": { "branch": "gh-pages", "path": "/" }
          }
          EOF
          echo "Pages source:"
          gh api "repos/${{ github.repository }}/pages" --jq '{build_type, html_url, source}'
